# Keymap mirrors Hyprland: Alt here = Super there. Prefix only for rare actions.

set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB,xterm-256color:RGB"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on
set -g set-clipboard on
set -g focus-events on
set -g mouse on
set -g escape-time 10
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys emacs
set -g detach-on-destroy off

# --- No-prefix keys (Alt) -----------------------------------------------------
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind -n M-S-Left  resize-pane -L 3
bind -n M-S-Right resize-pane -R 3
bind -n M-S-Up    resize-pane -U 2
bind -n M-S-Down  resize-pane -D 2

bind -n M-C-S-Left  swap-pane -s '{left-of}'
bind -n M-C-S-Right swap-pane -s '{right-of}'
bind -n M-C-S-Up    swap-pane -s '{up-of}'
bind -n M-C-S-Down  swap-pane -s '{down-of}'

# Split along the longer side, like Hyprland's dwindle layout
bind -n M-Enter if -F '#{e|>:#{pane_width},#{e|*:#{pane_height},2}}' \
  'split-window -h -c "#{pane_current_path}"' \
  'split-window -v -c "#{pane_current_path}"'
bind -n M-q kill-pane
bind -n M-f resize-pane -Z
bind -n M-j next-layout

bind -n M-C-Left  previous-window
bind -n M-C-Right next-window

bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
bind -n M-! join-pane -t :1
bind -n M-@ join-pane -t :2
bind -n 'M-#' join-pane -t :3
bind -n 'M-$' join-pane -t :4
bind -n M-% join-pane -t :5
bind -n M-^ join-pane -t :6
bind -n M-& join-pane -t :7
bind -n M-* join-pane -t :8
bind -n M-( join-pane -t :9

# --- Prefix keys (Ctrl+Space, then ...) -----------------------------------------
bind t new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind s choose-tree -Zs
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
bind x confirm-before -p "kill pane? (y/n)" kill-pane

# --- Agent status (set by ~/.config/tmux/agent-status.sh from Claude Code hooks)
set-hook -g session-window-changed 'if -F "#{==:#{@agent},✓}" "set -w -u @agent"'

# --- Theme ----------------------------------------------------------------------
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W#{?@agent, #{@agent},}"
set -g @catppuccin_window_current_text " #W#{?@agent, #{@agent},}"
if "test -f ~/.config/tmux/plugins/tmux/catppuccin.tmux" \
  "run ~/.config/tmux/plugins/tmux/catppuccin.tmux"

set -g status-position top
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"

# --- Plugins --------------------------------------------------------------------
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.1'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-floax'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @floax-bind '-n M-s'
set -g @floax-border-color '#89b4fa'
set -g @floax-text-color '#cdd6f4'

if "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"
run ~/.config/tmux/plugins/tpm/tpm
if "test ! -d ~/.config/tmux/plugins/tmux" \
  "run ~/.config/tmux/plugins/tpm/bin/install_plugins"
